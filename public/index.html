<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Impulsa — Seu ponto de partida</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #07111f;
      color: white;
      min-height: 100vh;
    }

    header {
      padding: 22px;
      text-align: center;
      border-bottom: 1px solid rgba(255,255,255,.08);
    }

    .logo {
      font-size: 30px;
      font-weight: 900;
      letter-spacing: 2px;
      color: #2f8cff;
    }

    .hero {
      min-height: calc(100vh - 80px);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 20px;
      background:
        radial-gradient(circle at 50% 30%, rgba(0,132,255,.25), transparent 35%),
        #07111f;
    }

    .content {
      max-width: 700px;
    }

    .tag {
      display: inline-block;
      padding: 8px 14px;
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 30px;
      color: #7db9ff;
      margin-bottom: 22px;
      font-size: 14px;
    }

    h1 {
      font-size: clamp(42px, 10vw, 76px);
      line-height: .95;
      margin-bottom: 22px;
    }

    h1 span {
      color: #ff8a00;
    }

    p {
      color: #b8c4d4;
      font-size: 18px;
      line-height: 1.6;
      margin-bottom: 30px;
    }

    .button {
      display: inline-block;
      padding: 16px 28px;
      border-radius: 12px;
      background: linear-gradient(135deg, #1683ff, #ff8a00);
      color: white;
      text-decoration: none;
      font-weight: bold;
      box-shadow: 0 10px 35px rgba(0,132,255,.25);
      transition: .25s;
    }

    .button:hover {
      transform: translateY(-3px);
    }

    .mini {
      margin-top: 25px;
      font-size: 13px;
      color: #718096;
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">IMPULSA</div>
  </header>

  <main class="hero">
    <div class="content">

      <div class="tag">SEU PONTO DE PARTIDA</div>

      <h1>
        Comece do zero.<br>
        <span>Impulsione seu futuro.</span>
      </h1>

      <p>
        Ideias, ferramentas e oportunidades para quem quer começar
        a construir uma renda pela internet.
      </p>

      <a class="button" href="https://www.instagram.com/impulsa.oficial_/">
        CONHECER A IMPULSA
      </a>

      <div class="mini">
        Não existe dinheiro fácil. Existe dinheiro possível.
      </div>

    </div>
  </main>

</body>
    </html>
